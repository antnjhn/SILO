name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux-only: install WebKit2GTK and other system deps required by Tauri
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libxdo-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Node dependencies
        run: npm install

      - name: Configure updater signing key
        run: |
          mkdir -p /tmp/tauri-keys
          echo "${{ secrets.UPDATER_PRIVATE_KEY }}" | base64 --decode > /tmp/tauri-keys/private.key
          echo "${{ secrets.UPDATER_KEY_PASSWORD }}" > /tmp/tauri-keys/password.txt
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.UPDATER_KEY_PASSWORD }}

      - name: Build Tauri app with updater artifacts
        run: |
          # Set environment variables for Tauri updater signing
          export TAURI_UPDATER_PRIVATE_KEY_PATH=/tmp/tauri-keys/private.key
          export TAURI_UPDATER_KEY_PASSWORD_PATH=/tmp/tauri-keys/password.txt
          npm run build

      - name: Get version from tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: silo-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: silo-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Generate and upload latest.json
        if: always()
        run: |
          mkdir -p dist
          # The Tauri build creates update artifacts including latest.json
          # Copy it from the build output
          ls src-tauri/target/release/bundle*/ 2>/dev/null || true
          # Copy the latest.json from the updater build output
          find . -name "latest.json" -type f 2>/dev/null | head -5
          # Copy all artifacts to dist
          cp -r src-tauri/target/release/bundle* dist/ 2>/dev/null || true

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Get version from tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SILO v${{ steps.get_version.outputs.VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/silo-windows/*.exe
            dist/silo-linux/*.deb
            dist/silo-linux/*.AppImage
            dist/latest.json